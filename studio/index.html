<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimmer Studio · Kroonen AI</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f1f4f8; --panel: #ffffff; --ink: #1c2b33; --muted: #5d6c7b; --line: #dde4ec;
    --accent: #0064e0; --accent-hover: #0050b5; --accent-tint: #e7f0fd; --accent-ink: #0050b5; --on-accent: #ffffff;
    --warn: #c2410c; --shadow: 0 1px 2px rgba(28,43,51,0.06), 0 8px 24px rgba(28,43,51,0.08);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1118; --surface: #111a24; --panel: #131d28; --ink: #e8eef4; --muted: #94a4b3; --line: #233242;
      --accent: #2d88ff; --accent-hover: #5aa2ff; --accent-tint: rgba(45,136,255,0.15); --accent-ink: #84b8ff; --warn: #fb923c;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); }
  button { font: inherit; font-size: 13.5px; font-weight: 500; border: 1px solid transparent; background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
  button:hover { background: var(--accent-tint); color: var(--accent-ink); }
  button.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover { background: var(--accent-hover); color: var(--on-accent); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=checkbox], input[type=range] { accent-color: var(--accent); }
  .app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }

  /* sidebar: brand, mix, filters, the dials */
  aside { border-right: 1px solid var(--line); background: var(--panel); min-height: 0; overflow-y: auto; }
  aside header { padding: 16px 16px 6px; }
  .filter { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 8px 16px 10px; border-bottom: 1px solid var(--line); }
  .brandrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .maps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .maps a { font-size: 12.5px; font-weight: 600; color: var(--accent-ink); background: var(--accent-tint); text-decoration: none; padding: 3px 10px; border-radius: 999px; }
  .maps a::after { content: " ↗"; font-weight: 400; }
  .maps a:hover { background: var(--accent); color: var(--on-accent); }
  .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; white-space: nowrap; }
  .brand-mark { width: 24px; height: 24px; flex: none; }
  .brand-mark .k { fill: var(--mark-k, #0a0a0c); } .brand-mark .b { fill: var(--mark-bg, #dcdce0); } .brand-mark .c { fill: var(--mark-c, #2fae62); }
  .brand-word { font-size: 15px; font-weight: 600; letter-spacing: -0.045em; }
  .brand-word span { font-weight: 400; color: var(--muted); }
  .brand-sep { width: 1px; height: 16px; background: var(--line); }
  .brand-product { font-size: 14.5px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  .on-now { margin-top: 12px; background: var(--surface); border-radius: 14px; padding: 10px 12px; }
  .on-now .head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; color: var(--accent-ink); text-transform: uppercase; letter-spacing: .05em; }
  .on-now .head span { flex: 1; }
  .on-now .head button { font-size: 12px; padding: 2px 10px; background: var(--panel); text-transform: none; letter-spacing: 0; }
  .on-now .none { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .on-now .live { display: grid; grid-template-columns: minmax(0, 1fr) 90px 2.6em auto; gap: 4px 8px; align-items: center; margin-top: 6px; font-size: 13px; }
  .on-now .live .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .on-now .live .v { font-variant-numeric: tabular-nums; color: var(--accent-ink); font-weight: 650; text-align: right; }
  .on-now .live button { padding: 0 7px; line-height: 20px; background: transparent; color: var(--muted); }
  .on-now .live button:hover { color: var(--warn); background: transparent; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .presets button { font-size: 12.5px; padding: 4px 11px; border: 1px solid var(--line); background: var(--panel); }
  .presets button:hover { border-color: var(--accent); }
  .system { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; }
  .system > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 8px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; }
  .system > summary::-webkit-details-marker { display: none; }
  .system > summary::before { content: "▸"; font-size: 10px; color: var(--muted); transition: transform .15s; }
  .system[open] > summary::before { transform: rotate(90deg); }
  .system > summary .state { margin-left: auto; font-size: 12px; color: var(--muted); }
  .system.on > summary .state { color: var(--accent-ink); font-weight: 650; }
  .system textarea { display: block; width: calc(100% - 16px); margin: 0 8px; resize: vertical; font-size: 13px; line-height: 1.45; min-height: 120px; max-height: 45vh; border-radius: 10px; }
  .system .actions { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px; font-size: 11.5px; color: var(--muted); }
  .system .actions span { flex: 1; }
  .system .actions button { font-size: 12px; padding: 2px 10px; }
  .search { width: 100%; margin-top: 0; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid transparent; border-radius: 999px; padding: 8px 14px; }
  .search:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  .layers { display: none; gap: 4px; margin-top: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .layers.on { display: flex; flex-wrap: wrap; }
  .layers span { margin-right: 4px; }
  .layers button { font-size: 12.5px; padding: 3px 11px; }
  .layers button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .vectors { padding: 6px 10px 24px; }
  .group { margin-top: 4px; }
  .group > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 10px 8px 6px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
  .group[open] > summary::before { transform: rotate(90deg); }
  .group > summary .count { font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--accent-ink); }
  .group > summary .note { flex-basis: 100%; padding-left: 18px; font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 11.5px; opacity: .85; }
  .group .more { display: block; margin: 6px auto 4px; font-size: 12.5px; }
  .vec { padding: 10px 10px; border-radius: 12px; }
  .vec + .vec { border-top: 1px solid var(--line); }
  .vec.on { background: var(--accent-tint); border-top-color: transparent; }
  .vec.on + .vec { border-top-color: transparent; }
  .vec .top { display: flex; align-items: baseline; gap: 8px; }
  .vec .name { font-weight: 600; font-size: 14px; flex: 1; cursor: pointer; }
  .vec .name:hover { color: var(--accent-ink); }
  .vec .layer { font-size: 11px; font-weight: 650; color: var(--accent-ink); background: var(--accent-tint); border-radius: 999px; padding: 1px 7px; }
  .vec.on .layer { background: var(--panel); }
  .vec .val { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 2.6em; text-align: right; }
  .vec.on .val { color: var(--accent-ink); font-weight: 650; }
  .vec .desc { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; }
  .vec .src { font-size: 11.5px; color: var(--muted); opacity: .9; }
  .vec .src a { color: var(--accent-ink); text-decoration: none; font-weight: 600; }
  .vec .src a:hover { text-decoration: underline; }
  input[type=range] { width: 100%; }
  .nomatch { color: var(--muted); font-size: 13px; padding: 16px 8px; }

  /* conversation */
  main { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
  .mobilebar { display: none; }
  .log { flex: 1; overflow-y: auto; padding: 28px max(24px, calc(50% - 400px)); }
  .empty { text-align: center; margin-top: 14vh; color: var(--muted); }
  .empty h2 { color: var(--ink); font-size: 26px; letter-spacing: -0.02em; margin: 0 0 8px; }
  .empty p { margin: 0 auto 20px; max-width: 30em; }
  .starters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .starters button { border: 1px solid var(--line); background: var(--panel); font-size: 14px; padding: 8px 14px; }
  .starters button:hover { border-color: var(--accent); }
  .msg { margin: 0 0 24px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble { background: var(--accent); color: var(--on-accent); border-radius: 20px 20px 6px 20px; padding: 10px 16px; max-width: 80%; white-space: pre-wrap; }
  .msg.bot .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--accent-tint); color: var(--accent-ink); font-weight: 650; }
  .chip.plain { background: var(--surface); color: var(--muted); font-weight: 500; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pair > div { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
  .pair > div:last-child { background: var(--surface); border-color: transparent; }
  .body p { margin: 0 0 10px; } .body ul, .body ol { margin: 0 0 10px; padding-left: 22px; }
  .body h3, .body h4 { margin: 12px 0 6px; font-size: 15px; }
  .body code { font-size: 13px; background: var(--surface); padding: 1px 5px; border-radius: 5px; }
  .think { font-size: 12.5px; color: var(--muted); border-left: 2px solid var(--accent-tint); padding-left: 10px; margin-bottom: 8px; white-space: pre-wrap; }
  .stats { display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--muted); margin-top: 4px; min-height: 22px; }
  .stats button { font-size: 11.5px; padding: 1px 9px; }
  .err { color: var(--warn); }
  form { border-top: 1px solid var(--line); background: var(--panel); padding: 14px max(24px, calc(50% - 400px)) 12px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid transparent; border-radius: 22px; padding: 11px 16px; min-height: 46px; max-height: 200px; }
  textarea:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  #send { padding: 11px 20px; font-size: 14.5px; }
  .opts { display: flex; gap: 8px 16px; font-size: 13px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .opts #reset { margin-left: auto; }
  select { font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); border: 1px solid transparent; border-radius: 999px; padding: 3px 8px; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0; z-index: 20; transform: translateX(-100%); transition: transform .2s; border-right: 0; }
    .app.dials aside { transform: none; }
    .mobilebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .closer { display: inline-block !important; }
    .log, form { padding-left: 16px; padding-right: 16px; }
    .pair { grid-template-columns: 1fr; }
    .opts #reset { margin-left: 0; }
  }
  .closer { display: none; }
</style>

<script>
const $ = (id) => document.getElementById(id);
const state = { vectors: [], byName: new Map(), mix: {}, history: [], busy: false, layers: [], layer: "all", shown: {}, abort: null };
try { const saved = localStorage.getItem("studio-layer"); if (saved) state.layer = saved === "all" ? "all" : +saved; } catch {}
const MAPPED = new Set([12, 15, 18, 21, 24, 27, 30, 33, 36]);  // layers with a map page next to this one
const STARTERS = ["Describe your ideal weekend.", "Tell me about yourself.", "What should I cook for dinner tonight?", "Write a short paragraph about a train journey."];

// No system prompt: both columns get the same conversation, so a comparison only differs by the steering.
function systemPrompt() { return ""; }
function withSystem(history) { return history.slice(); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Just enough Markdown for chat replies: headings, lists, bold, italics, code.
function render(md) {
  const inline = (s) => escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of md.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { close(); continue; }
    if ((m = line.match(/^#{1,6}\s+(.*)/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close();
    out.push(`<p>${inline(line)}</p>`);
  }
  close();
  return out.join("");
}

// dials without a layer field are layer 24, where the first SAE sits
const layerOf = (v) => v.layer ?? 24;
const labelOf = (name) => state.byName.get(name)?.label || name;
const layerTag = (name) => { const v = state.byName.get(name); return v && state.layers.length > 1 ? ` L${layerOf(v)}` : ""; };
// an SAE feature dial says which feature it is in its source line
function mapLink(v) {
  const m = /SAE feature (\d+)/.exec(v.source || "");
  return m && MAPPED.has(layerOf(v)) ? `layer-${layerOf(v)}.html#${m[1]}` : null;
}

function activeMix() {
  return Object.fromEntries(Object.entries(state.mix).filter(([, v]) => v > 0));
}

function chipsFor(mix) {
  const entries = Object.entries(mix);
  if (!entries.length) return `<span class="chip plain">unsteered</span>`;
  return entries.map(([k, v]) => `<span class="chip">${escapeHtml(labelOf(k))}${layerTag(k)} ${v.toFixed(2)}</span>`).join("");
}

const GROUPS = [
  ["companion", "Companions", ""],
  ["anime", "Anime", ""],
  ["character", "Characters", ""],
  ["mood", "Moods and styles", ""],
  ["discovered", "Discovered", "found by scanning every feature"],
  ["untested", "Discovered, untested", "single features, strengths from one-reply tests"],
  ["found", "Found, full score", "steering test: the judge saw the concept clearly and the text stayed fluent"],
  ["found-partial", "Found, partial", "steering test: score 0.67, the concept shows but weaker or less fluent"],
  ["research", "Research", "private, for interpretability work"],
  ["safety", "Safety research", "flagged safety-relevant features; private, never for demos"],
];
const PAGE = 120;

function loadOpenGroups() {
  try { return JSON.parse(localStorage.getItem("studio-open-groups")) || null; } catch { return null; }
}
function saveOpenGroups(open) {
  try { localStorage.setItem("studio-open-groups", JSON.stringify(open)); } catch {}
}
state.openGroups = loadOpenGroups() || { companion: true, anime: true, character: true, mood: false, research: false };

// One dial's value changed: every slider and readout for it follows, and the On now list
// is rebuilt only when a dial turns on or off, so dragging never loses its slider.
function setDial(name, x) {
  const was = (state.mix[name] || 0) > 0;
  state.mix[name] = x;
  for (const row of document.querySelectorAll(`[data-name="${CSS.escape(name)}"]`)) {
    const slider = row.querySelector("input[type=range]");
    if (slider && +slider.value !== x) slider.value = x;
    const val = row.querySelector(".val, .v");
    if (val) val.textContent = x ? x.toFixed(2) : "off";
    row.classList.toggle("on", x > 0);
  }
  if (was !== x > 0) renderActive();
}

function renderActive() {
  const box = $("active");
  const mix = activeMix();
  const names = Object.keys(mix);
  $("openDials").textContent = names.length ? `Dials · ${names.length} on` : "Dials";
  if (!names.length) { box.innerHTML = `<div class="none">No steering. Turn up a dial below, or click a dial's name for its suggested strength.</div>`; return; }
  box.innerHTML = "";
  for (const name of names) {
    const row = document.createElement("div");
    row.className = "live";
    row.dataset.name = name;
    row.innerHTML = `<span class="n" title="${escapeHtml(labelOf(name))}">${escapeHtml(labelOf(name))}${escapeHtml(layerTag(name))}</span>
      <input type="range" min="0" max="1" step="0.05" value="${mix[name]}" aria-label="${escapeHtml(labelOf(name))} strength">
      <span class="v">${mix[name].toFixed(2)}</span><button type="button" aria-label="Turn off ${escapeHtml(labelOf(name))}">✕</button>`;
    row.querySelector("input").addEventListener("input", (e) => setDial(name, parseFloat(e.target.value)));
    row.querySelector("button").addEventListener("click", () => setDial(name, 0));
    box.appendChild(row);
  }
}

function vectorRow(v) {
  const value = state.mix[v.name] || 0;
  const row = document.createElement("div");
  row.className = "vec" + (value > 0 ? " on" : "");
  row.dataset.name = v.name;
  const tag = state.layers.length > 1 ? `<span class="layer" title="Added after layer ${layerOf(v)}">L${layerOf(v)}</span>` : "";
  const link = mapLink(v);
  row.innerHTML = `
    <div class="top"><span class="name" title="Click for the suggested strength">${escapeHtml(v.label || v.name)}</span>${tag}<span class="val">${value ? value.toFixed(2) : "off"}</span></div>
    <div class="desc">${escapeHtml(v.description || "")}</div>
    <input type="range" min="0" max="1" step="0.05" value="${value}" aria-label="${escapeHtml(v.label || v.name)} strength">
    <div class="src">${escapeHtml(v.source || "")}${v.default ? ` · suggested ${v.default}` : ""}${link ? ` · <a href="${link}" target="_blank" rel="noopener">on the map</a>` : ""}</div>`;
  row.querySelector("input").addEventListener("input", (e) => setDial(v.name, parseFloat(e.target.value)));
  row.querySelector(".name").addEventListener("click", () => setDial(v.name, state.mix[v.name] ? 0 : (v.default || 0.5)));
  return row;
}

// Groups fill in when opened, a page of dials at a time, so thousands of dials stay fast.
function fill(details, key, members) {
  details.querySelector(".more")?.remove();
  const start = details.querySelectorAll(".vec").length, end = Math.max(state.shown[key] || PAGE, start + 1);
  for (const v of members.slice(start, end)) details.appendChild(vectorRow(v));
  const left = members.length - Math.min(end, members.length);
  if (left > 0) {
    const more = document.createElement("button");
    more.type = "button"; more.className = "more"; more.textContent = `Show ${Math.min(left, PAGE)} more of ${left.toLocaleString()}`;
    more.addEventListener("click", () => { state.shown[key] = end + PAGE; fill(details, key, members); });
    details.appendChild(more);
  }
}

function renderVectors() {
  const box = $("vectors");
  box.innerHTML = "";
  const q = ($("search").value || "").trim().toLowerCase();
  const known = new Set(GROUPS.map(([key]) => key));
  let shown = 0;
  for (const [key, title, note] of [...GROUPS, ["other", "Other", ""]]) {
    const members = state.vectors.filter((v) => (known.has(v.group) ? v.group : "other") === key &&
      (state.layer === "all" || layerOf(v) === state.layer) && (!q || v.search.includes(q)));
    if (!members.length) continue;
    shown += members.length;
    const details = document.createElement("details");
    details.className = "group";
    details.open = q ? true : state.openGroups[key] ?? !["untested", "research", "found", "found-partial", "safety"].includes(key);
    details.innerHTML = `<summary>${escapeHtml(title)} <span class="count">${members.length.toLocaleString()}</span>${note ? `<span class="note">${escapeHtml(note[0].toUpperCase() + note.slice(1))}</span>` : ""}</summary>`;
    details.addEventListener("toggle", () => {
      if (!q) { state.openGroups[key] = details.open; saveOpenGroups(state.openGroups); }
      if (details.open && !details.querySelector(".vec")) fill(details, key, members);
    });
    if (details.open) fill(details, key, members);
    box.appendChild(details);
  }
  if (!shown) box.innerHTML = `<div class="nomatch">No dial matches${q ? ` “${escapeHtml(q)}”` : ""}${state.layer !== "all" ? ` on layer ${state.layer}` : ""}.</div>`;
  renderActive();
}

function renderLayers() {
  const box = $("layers");
  state.layers = [...new Set(state.vectors.map(layerOf))].sort((a, b) => a - b);
  if (!state.layers.includes(state.layer)) state.layer = "all";
  box.classList.toggle("on", state.layers.length > 1);
  $("tagline").textContent = `Muse Glimmer 30B with ${state.vectors.length.toLocaleString()} dials from its own ${state.layers.length > 1 ? `layers ${state.layers.join(", ").replace(/, (\d+)$/, " and $1")}` : `layer ${state.layers[0] ?? 24}`} added back in, live, per reply.`;
  box.innerHTML = "<span>Layer</span>";
  for (const value of ["all", ...state.layers]) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = value === "all" ? "All" : value;
    b.setAttribute("aria-pressed", String(state.layer === value));
    b.addEventListener("click", () => {
      state.layer = value;
      state.shown = {};
      try { localStorage.setItem("studio-layer", String(value)); } catch {}
      renderLayers();
      renderVectors();
    });
    box.appendChild(b);
  }
}

async function loadVectors() {
  try {
    const res = await fetch("steering");
    const data = await res.json();
    state.vectors = data.vectors || [];
    if (!state.vectors.length) throw new Error("this server has no --steering-dir");
    for (const v of state.vectors) {
      v.search = `${v.name} ${v.label || ""} ${v.description || ""}`.toLowerCase();
      state.byName.set(v.name, v);
    }
    renderLayers();
    renderVectors();
  } catch (e) {
    $("vectors").innerHTML = `<div class="nomatch err">Could not load features: ${escapeHtml(String(e.message || e))}</div>`;
  }
}

async function stream(messages, steering, onDelta, signal) {
  const body = {
    messages, stream: true, max_tokens: 1500, steering,
    chat_template_kwargs: { reasoning_strength: $("effort").value },
  };
  const res = await fetch("v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { msg = (await res.json()).error?.message || msg; } catch {}
    if (BENT.test(msg)) return streamRaw(messages, steering, onDelta, signal);
    throw new Error(msg);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "", content = "", reasoning = "", timings = null;
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        const chunk = JSON.parse(data);
        if (chunk.error) {
          if (BENT.test(chunk.error.message || "")) {
            reader.cancel();
            return streamRaw(messages, steering, onDelta, signal);
          }
          throw new Error(chunk.error.message || "server error");
        }
        if (chunk.timings) timings = chunk.timings;
        const d = chunk.choices?.[0]?.delta || {};
        if (d.content) content += d.content;
        if (d.reasoning_content) reasoning += d.reasoning_content;
        onDelta(content, reasoning);
      }
    }
  } catch (e) {
    if (e.name === "AbortError") return { content, reasoning, timings, stopped: true };
    throw e;
  }
  return { content, reasoning, timings };
}

// A strong dial can bend Glimmer's own reply header (a language dial translates "to=user"), and then
// the chat endpoint cannot parse the reply. Ask for the raw text instead and split the channels here.
const BENT = /does not match the expected .*format/i;

function splitChannels(raw) {
  let content = "", reasoning = "";
  for (const seg of raw.split("<|start|>")) {
    const at = seg.indexOf("<|message|>");
    if (at < 0) continue;
    const text = seg.slice(at + "<|message|>".length).replace(/<\|[a-z_]+\|>/g, "").trim();
    if (/user/.test(seg.slice(0, at))) content += (content ? "\n\n" : "") + text;
    else reasoning += (reasoning ? "\n\n" : "") + text;
  }
  return { content, reasoning };
}

async function streamRaw(messages, steering, onDelta, signal) {
  const headers = { "Content-Type": "application/json" };
  const tpl = await fetch("apply-template", { method: "POST", headers, signal,
    body: JSON.stringify({ messages, chat_template_kwargs: { reasoning_strength: $("effort").value } }) });
  if (!tpl.ok) throw new Error(`HTTP ${tpl.status}`);
  const { prompt } = await tpl.json();
  const res = await fetch("completion", { method: "POST", headers, signal,
    body: JSON.stringify({ prompt, stream: true, n_predict: 1500, steering }) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "", raw = "", timings = null, parts = { content: "", reasoning: "" };
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const chunk = JSON.parse(line.slice(5).trim());
        if (chunk.error) throw new Error(chunk.error.message || "server error");
        if (chunk.timings) timings = chunk.timings;
        raw += chunk.content || "";
        parts = splitChannels(raw);
        onDelta(parts.content, parts.reasoning);
      }
    }
  } catch (e) {
    if (e.name === "AbortError") return { ...parts, timings, bent: true, stopped: true };
    throw e;
  }
  return { ...parts, timings, bent: true };
}

function replyBlock(container, mix, note = "") {
  const el = document.createElement("div");
  const system = systemPrompt();
  const systemChip = system ? `<span class="chip plain" title="${escapeHtml(system.slice(0, 400))}">system prompt</span>` : "";
  el.innerHTML = `<div class="chips">${chipsFor(mix)}${systemChip}${note ? `<span class="chip plain" title="Earlier turns in this column are the steered replies, so the persona can carry over through context">${escapeHtml(note)}</span>` : ""}</div><div class="think" hidden></div><div class="body"></div><div class="stats"></div>`;
  container.appendChild(el);
  let text = "";
  return {
    update(content, reasoning) {
      text = content;
      const think = el.querySelector(".think");
      think.hidden = !($("showThink").checked && reasoning);
      think.textContent = reasoning;
      el.querySelector(".body").innerHTML = render(content || "…");
      scrollDown();
    },
    done(r) {
      const notes = [];
      if (r.timings?.predicted_per_second) notes.push(`${r.timings.predicted_n} tokens · ${r.timings.predicted_per_second.toFixed(0)} tok/s`);
      if (r.bent) notes.push("steering bent the reply format, shown raw");
      if (r.stopped) notes.push("stopped");
      const stats = el.querySelector(".stats");
      stats.innerHTML = `<span>${escapeHtml(notes.join(" · "))}</span>`;
      if (text) {
        const copy = document.createElement("button");
        copy.type = "button"; copy.textContent = "Copy";
        copy.addEventListener("click", async () => {
          try { await navigator.clipboard.writeText(text); copy.textContent = "Copied"; } catch { copy.textContent = "Copy failed"; }
          setTimeout(() => { copy.textContent = "Copy"; }, 1500);
        });
        stats.appendChild(copy);
      }
    },
    fail(e) { el.querySelector(".body").innerHTML = `<p class="err">${escapeHtml(String(e.message || e))}</p>`; },
  };
}

function scrollDown() { const log = $("log"); log.scrollTop = log.scrollHeight; }

function showEmpty(title, line) {
  $("log").innerHTML = `<div class="empty" id="empty"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(line)}</p>
    <div class="starters">${STARTERS.map((s) => `<button type="button">${escapeHtml(s)}</button>`).join("")}</div></div>`;
  for (const b of $("log").querySelectorAll(".starters button")) b.addEventListener("click", () => { if (!state.busy) send(b.textContent); });
}

function setBusy(busy) {
  state.busy = busy;
  $("send").textContent = busy ? "Stop" : "Send";
  $("send").type = busy ? "button" : "submit";
}

async function send(text) {
  setBusy(true);
  state.abort = new AbortController();
  const signal = state.abort.signal;
  $("empty")?.remove();
  const log = $("log");
  const u = document.createElement("div");
  u.className = "msg user";
  u.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  log.appendChild(u);
  state.history.push({ role: "user", content: text });

  const mix = activeMix();
  const compare = $("compare").checked && Object.keys(mix).length > 0;
  const m = document.createElement("div");
  m.className = "msg bot";
  const holder = document.createElement("div");
  if (compare) holder.className = "pair";
  m.appendChild(holder);
  log.appendChild(m);
  scrollDown();

  // Plain Glimmer keeps its own branch of the conversation, so its column never reads the
  // steered replies. A branch opened mid-chat starts from the turns so far, and says so.
  if (compare && !state.plain) {
    state.plain = { history: state.history.slice(0, -1), shared: state.history.length > 1 };
  } else if (!compare) {
    state.plain = null;
  }
  const messages = withSystem(state.history);
  const steered = replyBlock(holder, mix);
  try {
    const r = await stream(messages, mix, steered.update, signal);
    steered.done(r);
    // the conversation continues from the steered reply, as far as it got
    state.history.push({ role: "assistant", content: r.content });
  } catch (e) {
    steered.fail(e);
    state.history.pop();
  }
  if (compare && !signal.aborted) {
    const branch = state.plain;
    branch.history.push({ role: "user", content: text });
    const plain = replyBlock(holder, {}, branch.shared ? "shares earlier turns" : "");
    try {
      const r = await stream(withSystem(branch.history), {}, plain.update, signal);
      plain.done(r);
      branch.history.push({ role: "assistant", content: r.content });
    } catch (e) {
      plain.fail(e);
      branch.history.pop();
    }
  } else if (compare) {
    state.plain = null;  // the plain column never answered this turn, so it starts over next time
  }
  state.abort = null;
  setBusy(false);
  $("input").focus();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || state.busy) return;
  $("input").value = "";
  $("input").style.height = "";
  send(text);
});
$("send").addEventListener("click", () => { if (state.busy) state.abort?.abort(); });
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", (e) => { e.target.style.height = ""; e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px"; });
$("clear").addEventListener("click", () => { state.mix = {}; renderVectors(); });
$("reset").addEventListener("click", () => {
  state.history = [];
  state.plain = null;
  showEmpty("New chat", "The dials stay where they are.");
});
$("openDials").addEventListener("click", () => $("app").classList.add("dials"));
$("closeDials").addEventListener("click", () => $("app").classList.remove("dials"));
// Tested mixes from presets.json next to this page. A preset replaces the current dials.
async function loadPresets() {
  for (const file of ["presets.json"]) {
    let presets = [];
    try {
      const res = await fetch(file);
      if (!res.ok) continue;
      presets = await res.json();
    } catch { continue; }
    for (const p of presets) {
      const mix = p.mix || {};
      if (!Object.keys(mix).every((k) => state.byName.has(k))) continue;
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = p.name;
      b.title = p.note || "";
      b.addEventListener("click", () => {
        state.mix = { ...mix };
        renderVectors();
      });
      $("presets").appendChild(b);
    }
  }
}

let searchTimer = null;
$("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.shown = {}; renderVectors(); }, 120); });
showEmpty("Steer Glimmer", "Turn up a dial, then say something. The dials apply to every reply and can change mid-conversation.");
renderActive();
loadVectors().then(loadPresets);
</script>
</body>
</html>
