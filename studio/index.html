<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimmer Studio</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6d6a64; --line: #e4e1db;
    --accent: #7a4cf5; --accent-soft: #efe9ff; --user: #1d1c1a; --user-ink: #faf9f7; --warn: #b4501f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214; --panel: #1b1b1f; --ink: #ecebe8; --muted: #9a978f; --line: #2c2c31;
      --accent: #a587ff; --accent-soft: #2a2340; --user: #ecebe8; --user-ink: #121214; --warn: #f08a5d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 20px 20px 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .mix { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .mix .summary { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .vectors { overflow-y: auto; padding: 8px 12px 20px; }
  .vec { padding: 10px 8px; border-radius: 10px; }
  .vec.on { background: var(--accent-soft); }
  .vec .top { display: flex; align-items: baseline; gap: 8px; }
  .vec .name { font-weight: 600; font-size: 14px; flex: 1; cursor: pointer; }
  .vec .val { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 2.6em; text-align: right; }
  .vec.on .val { color: var(--accent); font-weight: 600; }
  .vec .desc { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .vec .src { font-size: 11px; color: var(--muted); opacity: .8; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  main { display: flex; flex-direction: column; min-height: 0; }
  .log { flex: 1; overflow-y: auto; padding: 28px max(24px, calc(50% - 380px)); }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .empty b { color: var(--ink); }
  .msg { margin: 0 0 22px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble { background: var(--user); color: var(--user-ink); border-radius: 16px 16px 4px 16px; padding: 10px 14px; max-width: 80%; white-space: pre-wrap; }
  .msg.bot .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pair > div { min-width: 0; }
  .body p { margin: 0 0 10px; } .body ul, .body ol { margin: 0 0 10px; padding-left: 22px; }
  .body h3, .body h4 { margin: 12px 0 6px; font-size: 15px; }
  .think { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin-bottom: 8px; white-space: pre-wrap; }
  .stats { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .err { color: var(--warn); }
  form { border-top: 1px solid var(--line); background: var(--panel); padding: 14px max(24px, calc(50% - 380px)); }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 46px; max-height: 200px; }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .opts { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  select { font: inherit; font-size: 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 42vh; }
    .log, form { padding-left: 16px; padding-right: 16px; }
    .pair { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Glimmer Studio</h1>
      <div class="sub">Muse Glimmer 30B with features from its own layer 24 added back in, live, per reply.</div>
      <div class="mix">
        <div class="summary" id="summary">No steering</div>
        <button type="button" id="clear">Clear</button>
      </div>
    </header>
    <div class="vectors" id="vectors"><div class="sub" style="padding:8px">Loading features…</div></div>
  </aside>
  <main>
    <div class="log" id="log">
      <div class="empty" id="empty">Move a slider, then say something.<br><b>The dials apply to every reply and can change mid-conversation.</b></div>
    </div>
    <form id="form">
      <div class="row">
        <textarea id="input" rows="1" placeholder="Message Glimmer"></textarea>
        <button class="primary" id="send" type="submit">Send</button>
      </div>
      <div class="opts">
        <label><input type="checkbox" id="compare"> Also show the unsteered reply</label>
        <label><input type="checkbox" id="showThink"> Show reasoning</label>
        <label>Reasoning <select id="effort"><option>low</option><option>medium</option><option>high</option></select></label>
        <button type="button" id="reset">New chat</button>
      </div>
    </form>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const state = { vectors: [], mix: {}, history: [], busy: false };

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Just enough Markdown for chat replies: headings, lists, bold, italics, code.
function render(md) {
  const inline = (s) => escapeHtml(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of md.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { close(); continue; }
    if ((m = line.match(/^#{1,6}\s+(.*)/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close();
    out.push(`<p>${inline(line)}</p>`);
  }
  close();
  return out.join("");
}

function activeMix() {
  return Object.fromEntries(Object.entries(state.mix).filter(([, v]) => v > 0));
}

function chipsFor(mix) {
  const entries = Object.entries(mix);
  if (!entries.length) return `<span class="chip plain">unsteered</span>`;
  return entries.map(([k, v]) => {
    const label = state.vectors.find((x) => x.name === k)?.label || k;
    return `<span class="chip">${escapeHtml(label)} ${v.toFixed(2)}</span>`;
  }).join("");
}

function updateSummary() {
  const mix = activeMix();
  const n = Object.keys(mix).length;
  $("summary").textContent = n ? Object.entries(mix).map(([k, v]) => `${state.vectors.find((x) => x.name === k)?.label || k} ${v.toFixed(2)}`).join(" + ") : "No steering";
}

function renderVectors() {
  const box = $("vectors");
  box.innerHTML = "";
  for (const v of state.vectors) {
    const value = state.mix[v.name] || 0;
    const row = document.createElement("div");
    row.className = "vec" + (value > 0 ? " on" : "");
    row.innerHTML = `
      <div class="top"><span class="name" title="Click for the suggested strength">${escapeHtml(v.label || v.name)}</span><span class="val">${value ? value.toFixed(2) : "off"}</span></div>
      <div class="desc">${escapeHtml(v.description || "")}</div>
      <input type="range" min="0" max="1" step="0.05" value="${value}" aria-label="${escapeHtml(v.label || v.name)} strength">
      <div class="src">${escapeHtml(v.source || "")}${v.default ? ` · suggested ${v.default}` : ""}</div>`;
    const slider = row.querySelector("input");
    const val = row.querySelector(".val");
    const set = (x) => {
      state.mix[v.name] = x;
      slider.value = x;
      val.textContent = x ? x.toFixed(2) : "off";
      row.classList.toggle("on", x > 0);
      updateSummary();
    };
    slider.addEventListener("input", () => set(parseFloat(slider.value)));
    row.querySelector(".name").addEventListener("click", () => set(state.mix[v.name] ? 0 : (v.default || 0.5)));
    box.appendChild(row);
  }
  updateSummary();
}

async function loadVectors() {
  try {
    const res = await fetch("steering");
    const data = await res.json();
    state.vectors = data.vectors || [];
    if (!state.vectors.length) throw new Error("this server has no --steering-dir");
    renderVectors();
  } catch (e) {
    $("vectors").innerHTML = `<div class="sub err" style="padding:8px">Could not load features: ${escapeHtml(String(e.message || e))}</div>`;
  }
}

async function stream(messages, steering, onDelta) {
  const body = {
    messages, stream: true, max_tokens: 1500, steering,
    chat_template_kwargs: { reasoning_strength: $("effort").value },
  };
  const res = await fetch("v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try { msg = (await res.json()).error?.message || msg; } catch {}
    throw new Error(msg);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "", content = "", reasoning = "", timings = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim();
      buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if (data === "[DONE]") continue;
      const chunk = JSON.parse(data);
      if (chunk.timings) timings = chunk.timings;
      const d = chunk.choices?.[0]?.delta || {};
      if (d.content) content += d.content;
      if (d.reasoning_content) reasoning += d.reasoning_content;
      onDelta(content, reasoning);
    }
  }
  return { content, reasoning, timings };
}

function replyBlock(container, mix) {
  const el = document.createElement("div");
  el.innerHTML = `<div class="chips">${chipsFor(mix)}</div><div class="think" hidden></div><div class="body"></div><div class="stats"></div>`;
  container.appendChild(el);
  return {
    update(content, reasoning) {
      const think = el.querySelector(".think");
      think.hidden = !($("showThink").checked && reasoning);
      think.textContent = reasoning;
      el.querySelector(".body").innerHTML = render(content || "…");
      scrollDown();
    },
    done(timings) {
      if (timings?.predicted_per_second) el.querySelector(".stats").textContent = `${timings.predicted_n} tokens · ${timings.predicted_per_second.toFixed(0)} tok/s`;
    },
    fail(e) { el.querySelector(".body").innerHTML = `<p class="err">${escapeHtml(String(e.message || e))}</p>`; },
  };
}

function scrollDown() { const log = $("log"); log.scrollTop = log.scrollHeight; }

async function send(text) {
  state.busy = true;
  $("send").disabled = true;
  $("empty")?.remove();
  const log = $("log");
  const u = document.createElement("div");
  u.className = "msg user";
  u.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  log.appendChild(u);
  state.history.push({ role: "user", content: text });

  const mix = activeMix();
  const compare = $("compare").checked && Object.keys(mix).length > 0;
  const m = document.createElement("div");
  m.className = "msg bot";
  const holder = document.createElement("div");
  if (compare) holder.className = "pair";
  m.appendChild(holder);
  log.appendChild(m);
  scrollDown();

  const messages = state.history.slice();
  const steered = replyBlock(holder, mix);
  try {
    const r = await stream(messages, mix, steered.update);
    steered.done(r.timings);
    // the conversation continues from the steered reply
    state.history.push({ role: "assistant", content: r.content });
  } catch (e) {
    steered.fail(e);
    state.history.pop();
  }
  if (compare) {
    const plain = replyBlock(holder, {});
    try { plain.done((await stream(messages, {}, plain.update)).timings); } catch (e) { plain.fail(e); }
  }
  state.busy = false;
  $("send").disabled = false;
  $("input").focus();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || state.busy) return;
  $("input").value = "";
  $("input").style.height = "";
  send(text);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", (e) => { e.target.style.height = ""; e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px"; });
$("clear").addEventListener("click", () => { state.mix = {}; renderVectors(); });
$("reset").addEventListener("click", () => {
  state.history = [];
  $("log").innerHTML = `<div class="empty" id="empty">New chat. The dials stay where they are.</div>`;
});
loadVectors();
</script>
</body>
</html>
