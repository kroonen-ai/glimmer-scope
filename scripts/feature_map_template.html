<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimmer Feature Map</title>
<style>
  :root { --bg: #ffffff; --surface: #f1f4f8; --panel: #ffffff; --ink: #1c2b33; --muted: #5d6c7b; --line: #dde4ec;
          --accent: #0064e0; --accent-hover: #0050b5; --accent-tint: #e7f0fd; --accent-ink: #0050b5; --on-accent: #ffffff;
          --map: #f5f8fb; --dim: rgba(93,108,123,0.10); --plane: rgba(0,100,224,0.035); --up: #e5484d; --down: #0064e0;
          --shadow: 0 1px 2px rgba(28,43,51,0.06), 0 8px 24px rgba(28,43,51,0.08);
          --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b1118; --surface: #111a24; --panel: #131d28; --ink: #e8eef4; --muted: #94a4b3; --line: #233242;
      --accent: #2d88ff; --accent-hover: #5aa2ff; --accent-tint: rgba(45,136,255,0.15); --accent-ink: #84b8ff; --map: #0b1118;
      --dim: rgba(148,164,179,0.09); --plane: rgba(45,136,255,0.05); --up: #ff6369; --down: #2d88ff; --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35); }
  }
  :root[data-theme="dark"] { --bg: #0b1118; --surface: #111a24; --panel: #131d28; --ink: #e8eef4; --muted: #94a4b3; --line: #233242;
    --accent: #2d88ff; --accent-hover: #5aa2ff; --accent-tint: rgba(45,136,255,0.15); --accent-ink: #84b8ff; --map: #0b1118;
    --dim: rgba(148,164,179,0.09); --plane: rgba(45,136,255,0.05); --up: #ff6369; --down: #2d88ff; --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--map); color: var(--ink); font: 14px/1.45 var(--font); }
  .bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px 12px; flex-wrap: wrap; align-items: center; z-index: 2;
         background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow); }
  .bar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; width: 100%; padding: 0 2px 10px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
  .bar h1 { font-size: 15px; margin: 0 6px 0 4px; }
  .bar .stat { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  input[type=search] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid transparent; border-radius: 999px; padding: 7px 14px; min-width: 260px; }
  input[type=search]:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  select, button { font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  select:hover, button:hover { background: var(--accent-tint); color: var(--accent-ink); }
  input[type=checkbox], input[type=range] { accent-color: var(--accent); }
  label.check, label.slide { display: flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); }
  label.slide b { color: var(--accent-ink); font-weight: 650; min-width: 2.2em; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 110px; }
  .more-toggle { display: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .tip { position: fixed; pointer-events: none; z-index: 4; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
         padding: 9px 12px; font-size: 12.5px; box-shadow: var(--shadow); display: none; }
  .tip b { font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; }
  .results { position: fixed; z-index: 5; width: min(440px, calc(100% - 24px)); max-height: 50vh; overflow: auto; margin: 0; padding: 6px; list-style: none;
             background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: none; }
  .results button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 7px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; }
  .results button:hover, .results button:focus-visible { background: var(--accent-tint); }
  .results li.meta { padding: 6px 10px; }
  .card { position: fixed; right: 12px; bottom: 12px; z-index: 3; width: min(400px, calc(100% - 24px)); max-height: 50vh; overflow: auto;
          background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: none; box-shadow: var(--shadow); }
  .card b { font-size: 14px; }
  .card h3 { font-size: 11.5px; margin: 14px 0 4px; color: var(--accent-ink); font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; }
  .card ul { margin: 2px 0 0; padding-left: 0; list-style: none; font-size: 12.5px; }
  .card li { padding: 3px 0; }
  .card a { color: var(--ink); text-decoration: none; cursor: pointer; font-weight: 500; }
  .card a:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
  .card .close { float: right; margin-left: 8px; }
  .legend { position: fixed; left: 12px; bottom: 12px; z-index: 2; font-size: 12px; color: var(--muted); background: var(--panel);
            border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; max-width: calc(100% - 24px); box-shadow: var(--shadow); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin: 0 4px 0 10px; }
  .legend i:first-child { margin-left: 0; }
  @media (max-width: 640px) {
    .bar { top: 8px; left: 8px; right: 8px; padding: 8px; gap: 8px; border-radius: 16px; }
    .bar-head { flex-direction: column; align-items: stretch; padding-bottom: 6px; }
    .bar .stat { margin-left: 0; }
    input[type=search] { min-width: 0; flex: 1; }
    .more-toggle { display: inline-block; }
    .bar:not(.open) .more { display: none; }
    .bar .stat { width: 100%; }
    .legend { left: 8px; bottom: 8px; }
    .card { right: 8px; bottom: 8px; width: calc(100% - 16px); }
  }
</style>
<!--THEME-->
</head>
<body>
<canvas id="map" aria-label="Map of SAE features"></canvas>
<div class="loading" id="loading">Loading the map…</div>
<div class="bar" id="bar">
  <!--BARHEAD-->
  <h1 id="title">Glimmer feature map</h1>
  <input type="search" id="q" placeholder="Search labels or feature ids" aria-label="Search features" autocomplete="off">
  <button type="button" class="more-toggle" id="more" aria-expanded="false">Options</button>
  <select id="color" class="more" aria-label="Color by">
    <option value="kind" selected>Color: kind</option>
    <option value="region">Color: region</option>
    <option value="score">Color: steering</option>
    <option value="safety">Color: safety-relevant</option>
  </select>
  <label class="check more"><input type="checkbox" id="names" checked> Region names</label>
  <button type="button" id="reset" class="more">Reset view</button>
  <span class="stat" id="stat"></span>
</div>
<ul class="results" id="results"></ul>
<div class="tip" id="tip"></div>
<div class="card" id="card"></div>
<div class="legend" id="legend"></div>
<script type="module">
const SRC = /*SRC*/null;
const loading = document.getElementById("loading");
let DATA = /*DATA*/null;
if (!DATA) {
  try { const r = await fetch(SRC); if (!r.ok) throw new Error(r.status); DATA = await r.json(); }
  catch (e) { loading.textContent = "The map didn't load. Reload the page to try again."; throw e; }
}
loading.remove();

const P = DATA.points, R = DATA.regions, byId = new Map(P.map((p) => [p.id, p]));
const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
const tip = document.getElementById("tip"), card = document.getElementById("card"), bar = document.getElementById("bar");
const qEl = document.getElementById("q"), results = document.getElementById("results"), colorEl = document.getElementById("color");
const SAFE = window.SAFE || { on: false, TEXT: "", hide: () => false, apply() {}, onChange() {} };  // Studio pages have no switch
// safe browsing: hidden features keep their point and kind; their label and region name are swapped out
SAFE.apply(P, ["label"]); SAFE.apply(R, ["name"], "");
const safetyOpt = colorEl.querySelector('option[value="safety"]');
function safeUI() {
  if (!safetyOpt) return;
  safetyOpt.hidden = safetyOpt.disabled = SAFE.on;
  if (SAFE.on && colorEl.value === "safety") colorEl.value = "kind";
}
safeUI();
SAFE.onChange(() => { safeUI(); legend(); if (selected) select(selected); else draw(); });
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hue = (i) => (i * 137.508) % 360;
const regionColor = R.map((r) => `hsl(${hue(r.id)}, 46%, 58%)`);
const KINDS = { concept: "#0064e0", syntax: "#8b5cf6", token: "#14a38b", format: "#f29a38", unclear: "#9aa6b4", unlabeled: "#cfd5dd" };
// gray first, so the colored kinds sit on top
const ORDER = { unlabeled: 0, unclear: 1 };
P.sort((a, b) => (ORDER[a.kind] ?? 2) - (ORDER[b.kind] ?? 2));
const SAFETY = { cbrn: "#e5484d", weapons_violence: "#f76b15", cyber: "#0090ff", deception_manipulation: "#d6409f",
  power_seeking: "#8e4ec6", sycophancy: "#ffc53d", hate_bias: "#a18072", self_harm: "#e54666", drugs: "#46a758", sexual: "#f39cc7", ai_self: "#12a594" };
const scoreColor = (s) => (s >= 0.99 ? css("--accent") : s >= 0.66 ? "#f5a524" : s > 0 ? "#8fa3b5" : "#7b6ba8");
// the judge's score is concept x fluency / 9: 1 is on topic and fluent, 0.667 one of the two slips
function steerWord(s) {
  if (s == null) return "not steering-tested";
  if (s >= 0.99) return "steers cleanly";
  if (s >= 0.66) return "steers partly";
  return s > 0 ? "weak effect" : "doesn't steer";
}
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const p of P) { if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x; if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; }
let view = null, fitScale = 1, matches = null, selected = null;

if (document.getElementById("site-nav")) {  // the shared site's header names the page
  document.getElementById("title").hidden = true;
  document.title = `Layer ${DATA.layer} · Glimmer Scope`;
}

const top = () => bar.getBoundingClientRect().bottom + 8;
function fit() {
  const w = canvas.clientWidth, h = canvas.clientHeight, pad = w < 640 ? 24 : 60, t = top();
  const s = Math.min((w - pad * 2) / (maxX - minX), (h - t - pad * 2) / (maxY - minY));
  view = { s, ox: w / 2 - s * (minX + maxX) / 2, oy: t + (h - t) / 2 - s * (minY + maxY) / 2 };
  fitScale = s;
}
const sx = (x) => view.ox + view.s * x, sy = (y) => view.oy + view.s * y;

function colorOf(p) {
  const mode = colorEl.value;
  if (mode === "kind") return KINDS[p.kind] || "#888";
  if (mode === "score") return p.score == null ? css("--dim") : scoreColor(p.score);
  if (mode === "safety") return p.safety ? SAFETY[p.safety] : css("--dim");
  return regionColor[p.region];
}

// region names on small labels, biggest region first: a few when zoomed out, more as you zoom in,
// never overlapping one already drawn and never cut by the edge
function drawNames(items) {
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif";
  const placed = [], shown = new Set(), W = canvas.clientWidth, H = canvas.clientHeight, t = top(), ink = css("--ink");
  const room = Math.round(18 * Math.min(6, view.s / fitScale) * Math.min(1, W / 900));
  const bg = css("--panel") || "#fff";
  for (const it of items.filter((i) => i.name).sort((a, b) => b.size - a.size)) {
    if (placed.length >= room) break;
    if (shown.has(it.name)) continue;  // two regions with the same name: label the bigger one
    const w = ctx.measureText(it.name).width + 14, box = [it.X - w / 2, it.Y - 11, it.X + w / 2, it.Y + 11];
    if (box[0] < 4 || box[2] > W - 4 || box[1] < t || box[3] > H - 40) continue;
    if (placed.some((b) => box[0] < b[2] + 4 && box[2] > b[0] - 4 && box[1] < b[3] + 4 && box[3] > b[1] - 4)) continue;
    placed.push(box); shown.add(it.name);
    ctx.globalAlpha = 0.92; ctx.fillStyle = bg;
    ctx.beginPath(); ctx.roundRect(box[0], box[1], w, 22, 11); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = ink; ctx.fillText(it.name, it.X, it.Y + 0.5);
  }
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css("--map"); ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  // points shrink with how many there are, so 60,000 features stay a map and not a smear
  const r = Math.max(1, Math.min(3.5, view.s * 0.045)), dim = css("--dim"), ink = css("--ink");
  ctx.globalAlpha = matches ? 1 : 0.85;
  for (const p of P) {
    ctx.fillStyle = !matches || matches.has(p.id) ? colorOf(p) : dim;
    ctx.fillRect(sx(p.x) - r / 2, sy(p.y) - r / 2, r, r);
  }
  ctx.globalAlpha = 1;
  if (matches) {
    ctx.strokeStyle = ink; ctx.lineWidth = 1;
    for (const p of P) if (matches.has(p.id)) { ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), r + 2.5, 0, 6.283); ctx.stroke(); }
  }
  if (selected) { ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sx(selected.x), sy(selected.y), r + 5, 0, 6.283); ctx.stroke(); }
  if (document.getElementById("names").checked && !matches) drawNames(R.map((reg) => ({ name: reg.name, size: reg.size, X: sx(reg.x), Y: sy(reg.y) })));
  const tested = P.filter((p) => p.score != null).length;
  document.getElementById("stat").textContent = (DATA.layer ? `layer ${DATA.layer} · ` : "") +
    `${P.length.toLocaleString()} features · ${R.filter((r) => r.size).length} regions · ${tested.toLocaleString()} steering-tested` + (matches ? ` · ${matches.size} match` : "");
}

function legend() {
  const el = document.getElementById("legend"), mode = colorEl.value;
  if (mode === "score") {
    el.innerHTML = [[1, "steers cleanly"], [0.667, "partly"], [0.333, "weak"], [0, "doesn't steer"]]
      .map(([s, t]) => `<i style="background:${scoreColor(s)}"></i>${t}`).join("") + `<i style="background:${css("--muted")};opacity:.3"></i>not tested`;
  } else if (mode === "kind") {
    const count = {}; for (const p of P) count[p.kind] = (count[p.kind] || 0) + 1;
    el.innerHTML = Object.entries(KINDS).filter(([k]) => count[k])
      .map(([k, c]) => `<i style="background:${c}"></i>${k} ${count[k].toLocaleString()}`).join("");
  } else {
    el.textContent = matchMedia("(pointer: coarse)").matches ? "Tap a dot to see its region. Pinch to zoom." : "Click a dot to see its region. Scroll to zoom, drag to move.";
  }
}

// nearest point under the cursor, through a coarse grid
let grid = null;
function buildGrid() {
  grid = new Map();
  for (const p of P) { const key = `${Math.floor(sx(p.x) / 12)},${Math.floor(sy(p.y) / 12)}`; (grid.get(key) || grid.set(key, []).get(key)).push(p); }
}
function nearest(mx, my, reach = 64) {
  let best = null, bd = reach;
  const gx = Math.floor(mx / 12), gy = Math.floor(my / 12);
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (const p of grid.get(`${gx + i},${gy + j}`) || []) {
    if (matches && !matches.has(p.id)) continue;
    const d = (sx(p.x) - mx) ** 2 + (sy(p.y) - my) ** 2; if (d < bd) { bd = d; best = p; }
  }
  return best;
}
function describe(p) {
  const reg = R[p.region];
  return `<b>${esc(p.label)}</b><div class="meta">feature ${p.id} · ${esc(p.kind || "")} · ${esc(reg.name)} · ${steerWord(p.score)}${p.j && p.score != null ? " (graded by a local model)" : ""}</div>`;
}

function select(p) {
  selected = p;
  history.replaceState(null, "", p ? `#${p.id}` : location.pathname + location.search);
  if (!p) { card.style.display = "none"; draw(); return; }
  const reg = R[p.region];
  const members = P.filter((q) => q.region === reg.id);
  const best = members.filter((q) => q.score >= 0.66 && q !== p).sort((a, b) => b.score - a.score).slice(0, 8);
  const sample = members.filter((q) => q !== p).sort(() => 0.5 - Math.random()).slice(0, 10);
  const item = (q) => `<li><a data-id="${q.id}">${esc(q.label)}</a> <span class="meta">#${q.id}${q.score != null ? " · " + steerWord(q.score) : ""}</span></li>`;
  card.innerHTML = `<button type="button" class="close">Close</button>${describe(p)}
    <h3>Region: ${esc(reg.name)} · ${members.length} features</h3>
    ${best.length ? `<h3>Steer best here</h3><ul>${best.map(item).join("")}</ul>` : ""}
    <h3>A few neighbors</h3><ul>${sample.map(item).join("")}</ul>`;
  card.style.display = "block";
  card.querySelector(".close").onclick = () => select(null);
  card.querySelectorAll("a[data-id]").forEach((a) => { a.onclick = () => focus(byId.get(+a.dataset.id)); });
  draw();
}
// center a feature, zoomed in, and open it
function focus(p) {
  if (!p) return;
  const w = canvas.clientWidth, h = canvas.clientHeight, t = top();
  view.s = Math.max(view.s, fitScale * 5);
  view.ox = w / 2 - view.s * p.x; view.oy = t + (h - t) / 2.6 - view.s * p.y;
  buildGrid(); select(p);
}

// mouse, pen and touch: drag to move, wheel or pinch to zoom, tap or click to open
const pointers = new Map();
let drag = null, pinch = null;
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  results.style.display = "none"; tip.style.display = "none";
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy, moved: false };
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: view.s, ox: view.ox, oy: view.oy, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    drag = null;
  }
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()], f = Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    view.s = pinch.s * f; view.ox = mx - (pinch.mx - pinch.ox) * f; view.oy = my - (pinch.my - pinch.oy) * f;
    tip.style.display = "none"; draw(); return;
  }
  if (drag) {
    view.ox = drag.ox + e.clientX - drag.x; view.oy = drag.oy + e.clientY - drag.y;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > (e.pointerType === "mouse" ? 3 : 8)) drag.moved = true;
    if (drag.moved) { tip.style.display = "none"; draw(); }
    return;
  }
  if (e.pointerType !== "mouse") return;
  const p = nearest(e.clientX, e.clientY);
  if (!p) { tip.style.display = "none"; return; }
  tip.innerHTML = describe(p); tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 360) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
function release(e) {
  pointers.delete(e.pointerId);
  if (drag && !drag.moved && e.type === "pointerup") select(nearest(e.clientX, e.clientY, e.pointerType === "mouse" ? 64 : 400));
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) { drag = null; canvas.classList.remove("dragging"); buildGrid(); }
}
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") tip.style.display = "none"; });
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015);
  view.ox = e.clientX - (e.clientX - view.ox) * f; view.oy = e.clientY - (e.clientY - view.oy) * f; view.s *= f;
  draw(); buildGrid();
}, { passive: false });

// search: matches light up on the map, and the best ones are listed to jump to
let found = [];
function search() {
  const q = qEl.value.trim().toLowerCase();
  if (!q) { matches = null; found = []; results.style.display = "none"; draw(); return; }
  found = P.filter((p) => p.label.toLowerCase().includes(q) || String(p.id) === q)
    .sort((a, b) => (String(b.id) === q) - (String(a.id) === q) || (b.score ?? -1) - (a.score ?? -1));
  matches = new Set(found.map((p) => p.id));
  const box = qEl.getBoundingClientRect();
  results.style.left = Math.max(8, Math.min(box.left, window.innerWidth - results.offsetWidth - 8)) + "px";
  results.style.top = box.bottom + 6 + "px";
  results.innerHTML = found.length
    ? found.slice(0, 12).map((p, n) => `<li><button type="button" data-n="${n}">${esc(p.label)} <span class="meta">#${p.id} · ${steerWord(p.score)}</span></button></li>`).join("") +
      (found.length > 12 ? `<li class="meta">${found.length - 12} more lit up on the map</li>` : "")
    : `<li class="meta">No feature matches “${esc(q)}”.</li>`;
  results.style.display = "block";
  results.querySelectorAll("button").forEach((b) => { b.onclick = () => { results.style.display = "none"; focus(found[+b.dataset.n]); }; });
  draw();
}
qEl.addEventListener("input", search);
qEl.addEventListener("focus", () => { if (qEl.value.trim()) search(); });
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && found.length) { results.style.display = "none"; focus(found[0]); }
  if (e.key === "Escape") { qEl.value = ""; search(); }
  if (e.key === "ArrowDown") { e.preventDefault(); results.querySelector("button")?.focus(); }
});
results.addEventListener("keydown", (e) => {
  const items = [...results.querySelectorAll("button")], i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown" && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
  if (e.key === "ArrowUp") { e.preventDefault(); (i > 0 ? items[i - 1] : qEl).focus(); }
  if (e.key === "Escape") { results.style.display = "none"; qEl.focus(); }
});
document.addEventListener("pointerdown", (e) => { if (!results.contains(e.target) && e.target !== qEl) results.style.display = "none"; });

document.getElementById("more").addEventListener("click", (e) => {
  const open = bar.classList.toggle("open"); e.target.setAttribute("aria-expanded", open); fit(); draw(); buildGrid();
});
colorEl.addEventListener("change", () => { legend(); draw(); });
document.getElementById("names").addEventListener("change", draw);
document.getElementById("reset").addEventListener("click", () => { fit(); draw(); buildGrid(); });
window.addEventListener("keydown", (e) => { if (e.key === "Escape" && e.target === document.body) select(null); });
window.addEventListener("themechange", () => { legend(); draw(); });  // the light/dark switch in the header
window.addEventListener("resize", () => { fit(); draw(); buildGrid(); });
fit(); legend(); draw(); buildGrid();
const linked = byId.get(+location.hash.slice(1));
if (/^#\d+$/.test(location.hash) && linked) focus(linked);
</script>
</body>
