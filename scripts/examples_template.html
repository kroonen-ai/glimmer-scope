<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steering examples · Glimmer Scope</title>
<style>
  :root { --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6d6a64; --line: #e4e1db; --accent: #7a4cf5; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #111114; --panel: #1b1b1f; --ink: #ecebe8; --muted: #9a978f; --line: #2c2c31; --accent: #a587ff; }
  }
  :root[data-theme="dark"] { --bg: #111114; --panel: #1b1b1f; --ink: #ecebe8; --muted: #9a978f; --line: #2c2c31; --accent: #a587ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .nav { display: flex; gap: 2px; overflow-x: auto; font-size: 14px; max-width: 1080px; margin: 0 auto; padding: 14px 10px 0; }
  .nav a { color: var(--muted); text-decoration: none; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .nav a:hover { color: var(--ink); }
  .nav a.home { color: var(--ink); font-weight: 650; }
  .nav a[aria-current] { color: var(--ink); background: var(--panel); }
  main { max-width: 1080px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  .lede { color: var(--muted); margin: 0 0 22px; max-width: 700px; }
  .prompts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 10px 0; }
  .prompts span { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .prompts button { font: inherit; font-size: 14px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .prompts button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; }
  .card.base { border-style: dashed; }
  .card h2 { font-size: 15px; margin: 0; }
  .meta { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
  .meta a { color: var(--muted); }
  .reply { white-space: pre-wrap; font-size: 14px; margin: 0; }
  .note { color: var(--muted); font-size: 13.5px; margin-top: 24px; max-width: 700px; }
</style>
</head>
<body>
<nav class="nav" id="nav"></nav>
<main>
  <h1>What steering does</h1>
  <p class="lede">The same question, answered by Glimmer with one feature turned up. The first card is the normal answer with nothing turned up. Pick another question to see how each feature bends that one too.</p>
  <div class="prompts" id="prompts" role="group" aria-label="Question"></div>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</main>
<script>
const NAV = /*NAV*/null;
const DATA = /*DATA*/null;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
document.getElementById("nav").innerHTML = `<a class="home" href="./">Glimmer Scope</a>` +
  (NAV ? NAV.links.map(([text, href]) => `<a href="${href}"${href === NAV.current ? ' aria-current="page"' : ""}>${esc(text)}</a>`).join("") : "");
// the replies are markdown: show bold, italics and bullets, drop heading marks
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
  .replace(/^#{1,6}\s*/gm, "").replace(/^(\s*)[*-] /gm, "$1• ");
let pick = 0;
const prompts = document.getElementById("prompts");
prompts.innerHTML = `<span>Question:</span>` + DATA.prompts.map((p, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${esc(p)}</button>`).join("");
prompts.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
  pick = +b.dataset.i;
  prompts.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
}));
function render() {
  document.getElementById("grid").innerHTML =
    `<article class="card base"><h2>Nothing turned up</h2><div class="meta">the normal answer</div><p class="reply">${md(DATA.baseline[pick])}</p></article>` +
    DATA.examples.map((e) => `<article class="card"><h2>${esc(e.label)}</h2>
      <div class="meta">layer ${e.layer} · <a href="layer-${e.layer}#${e.id}">feature ${e.id}</a> · strength ${e.strength}</div>
      <p class="reply">${md(e.replies[pick])}</p></article>`).join("");
}
document.getElementById("note").textContent = `Generated with greedy decoding, so the same settings give the same text, and cut at about ${DATA.tokens} tokens. ` +
  `Strength is how hard the feature is pushed, as a fraction of the typical size of the model's activations at that layer.`;
render();
</script>
</body>
</html>
