<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steering examples · Glimmer Scope</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55; }
  .head { background: radial-gradient(900px 320px at 85% -20%, var(--accent-tint), transparent 70%); border-bottom: 1px solid var(--line); }
  .head .wrap { padding-top: 44px; padding-bottom: 28px; }
  h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 12px; }
  .lede { color: var(--muted); font-size: 17px; margin: 0; max-width: 46em; }
  .prompts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; position: sticky; top: 57px; z-index: 5; background: var(--bg); padding: 14px 0; border-bottom: 1px solid var(--line); }
  .prompts span { color: var(--muted); font-size: 14px; margin-right: 4px; font-weight: 500; }
  .prompts button { font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); background: var(--surface); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .prompts button:hover { color: var(--accent-ink); background: var(--accent-tint); }
  .prompts button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; display: flex; flex-direction: column; transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .card.base { background: var(--surface); border-color: transparent; }
  .card.base:hover { box-shadow: none; }
  .tagline { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .pill { font-size: 12px; font-weight: 650; border-radius: 999px; padding: 3px 10px; color: var(--accent-ink); background: var(--accent-tint); text-decoration: none; }
  a.pill:hover { background: var(--accent); color: var(--on-accent); }
  .pill.muted { color: var(--muted); background: var(--panel); }
  .card h2 { font-size: 17px; letter-spacing: -0.01em; margin: 0 0 10px; }
  .reply { white-space: pre-wrap; font-size: 14.5px; margin: 0; }
  .note { color: var(--muted); font-size: 14px; margin-top: 28px; max-width: 46em; }
  @media (max-width: 720px) { .prompts { top: 92px; } .grid { grid-template-columns: 1fr; } }
</style>
<!--THEME-->
</head>
<body>
<!--HEADER-->
<section class="head"><div class="wrap">
  <p class="eyebrow">Steering examples</p>
  <h1>What steering does</h1>
  <p class="lede">The same question, answered by Glimmer with one feature turned up. The first card is the normal answer with nothing turned up. Pick another question to see how each feature bends that one too.</p>
</div></section>
<main class="wrap">
  <div class="prompts" id="prompts" role="group" aria-label="Question"></div>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</main>
<script>
const DATA = /*DATA*/null;
const SAFE = window.SAFE || { on: false, TEXT: "", hide: () => false, apply() {}, onChange() {} };  // Studio pages have no switch
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// the replies are markdown: show bold, italics and bullets, drop heading marks
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
  .replace(/^#{1,6}\s*/gm, "").replace(/^(\s*)[*-] /gm, "$1• ");
let pick = 0;
const prompts = document.getElementById("prompts");
prompts.innerHTML = `<span>Question:</span>` + DATA.prompts.map((p, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${esc(p)}</button>`).join("");
prompts.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
  pick = +b.dataset.i;
  prompts.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
}));
function render() {
  document.getElementById("grid").innerHTML =
    `<article class="card base"><div class="tagline"><span class="pill muted">Baseline</span></div><h2>Nothing turned up</h2><p class="reply">${md(DATA.baseline[pick])}</p></article>` +
    DATA.examples.map((e) => `<article class="card"><div class="tagline"><a class="pill" href="layer-${e.layer}#${e.id}">Layer ${e.layer} · #${e.id}</a><span class="pill muted">strength ${e.strength}</span></div>
      ${SAFE.hide(e) ? `<h2>${SAFE.TEXT}</h2><p class="reply meta">This example could be upsetting or misused. Turn safe browsing off in the header to read it.</p>`
        : `<h2>${esc(e.label[0].toUpperCase() + e.label.slice(1))}</h2><p class="reply">${md(e.replies[pick])}</p>`}</article>`).join("");
}
SAFE.onChange(() => render());
document.getElementById("note").textContent = `Generated with greedy decoding, so the same settings give the same text, and cut at about ${DATA.tokens} tokens. ` +
  `Strength is how hard the feature is pushed, as a fraction of the typical size of the model's activations at that layer.`;
render();
</script>
</body>
</html>
