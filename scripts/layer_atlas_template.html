<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimmer Layer Atlas</title>
<style>
  :root { --bg: #ffffff; --surface: #f1f4f8; --panel: #ffffff; --ink: #1c2b33; --muted: #5d6c7b; --line: #dde4ec;
          --accent: #0064e0; --accent-hover: #0050b5; --accent-tint: #e7f0fd; --accent-ink: #0050b5; --on-accent: #ffffff;
          --map: #f5f8fb; --dim: rgba(93,108,123,0.10); --plane: rgba(0,100,224,0.035); --up: #e5484d; --down: #0064e0;
          --shadow: 0 1px 2px rgba(28,43,51,0.06), 0 8px 24px rgba(28,43,51,0.08);
          --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b1118; --surface: #111a24; --panel: #131d28; --ink: #e8eef4; --muted: #94a4b3; --line: #233242;
      --accent: #2d88ff; --accent-hover: #5aa2ff; --accent-tint: rgba(45,136,255,0.15); --accent-ink: #84b8ff; --map: #0b1118;
      --dim: rgba(148,164,179,0.09); --plane: rgba(45,136,255,0.05); --up: #ff6369; --down: #2d88ff; --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35); }
  }
  :root[data-theme="dark"] { --bg: #0b1118; --surface: #111a24; --panel: #131d28; --ink: #e8eef4; --muted: #94a4b3; --line: #233242;
    --accent: #2d88ff; --accent-hover: #5aa2ff; --accent-tint: rgba(45,136,255,0.15); --accent-ink: #84b8ff; --map: #0b1118;
    --dim: rgba(148,164,179,0.09); --plane: rgba(45,136,255,0.05); --up: #ff6369; --down: #2d88ff; --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.35); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--map); color: var(--ink); font: 14px/1.45 var(--font); }
  .bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px 12px; flex-wrap: wrap; align-items: center; z-index: 2;
         background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow); }
  .bar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; width: 100%; padding: 0 2px 10px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
  .bar h1 { font-size: 15px; margin: 0 6px 0 4px; }
  .bar .stat { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  input[type=search] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid transparent; border-radius: 999px; padding: 7px 14px; min-width: 260px; }
  input[type=search]:focus { outline: none; border-color: var(--accent); background: var(--panel); }
  select, button { font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  select:hover, button:hover { background: var(--accent-tint); color: var(--accent-ink); }
  input[type=checkbox], input[type=range] { accent-color: var(--accent); }
  label.check, label.slide { display: flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); }
  label.slide b { color: var(--accent-ink); font-weight: 650; min-width: 2.2em; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 110px; }
  .more-toggle { display: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .tip { position: fixed; pointer-events: none; z-index: 4; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
         padding: 9px 12px; font-size: 12.5px; box-shadow: var(--shadow); display: none; }
  .tip b { font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; }
  .results { position: fixed; z-index: 5; width: min(440px, calc(100% - 24px)); max-height: 50vh; overflow: auto; margin: 0; padding: 6px; list-style: none;
             background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: none; }
  .results button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 7px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; }
  .results button:hover, .results button:focus-visible { background: var(--accent-tint); }
  .results li.meta { padding: 6px 10px; }
  .card { position: fixed; right: 12px; bottom: 12px; z-index: 3; width: min(400px, calc(100% - 24px)); max-height: 50vh; overflow: auto;
          background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: none; box-shadow: var(--shadow); }
  .card b { font-size: 14px; }
  .card h3 { font-size: 11.5px; margin: 14px 0 4px; color: var(--accent-ink); font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; }
  .card ul { margin: 2px 0 0; padding-left: 0; list-style: none; font-size: 12.5px; }
  .card li { padding: 3px 0; }
  .card a { color: var(--ink); text-decoration: none; cursor: pointer; font-weight: 500; }
  .card a:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
  .card .close { float: right; margin-left: 8px; }
  .legend { position: fixed; left: 12px; bottom: 12px; z-index: 2; font-size: 12px; color: var(--muted); background: var(--panel);
            border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; max-width: calc(100% - 24px); box-shadow: var(--shadow); }
  .card li { display: flex; gap: 8px; }
  .card li .cos { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 2.6em; }
  .card ul.thread { border-left: 2px solid var(--line); margin-left: 4px; padding-left: 8px; }
  .card ul.thread li { align-items: baseline; }
  .card ul.thread li.here { background: var(--accent-tint); border-radius: 6px; margin-left: -6px; padding-left: 6px; }
  .card .lyr { font-variant-numeric: tabular-nums; font-weight: 650; color: var(--accent-ink); min-width: 2.4em; }
  .card details { margin-top: 10px; } .card summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  .card .stackit { margin-top: 10px; font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel);
                   color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin: 0 4px 0 8px; }
  .legend .chips { margin-top: 4px; }
  .legend .chips i { width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin: 0 4px 0 10px; }
  .legend .chips i:first-child { margin-left: 0; }
  @media (max-width: 640px) {
    .bar { top: 8px; left: 8px; right: 8px; padding: 8px; gap: 8px 10px; border-radius: 16px; }
    .bar-head { flex-direction: column; align-items: stretch; padding-bottom: 6px; }
    .bar .stat { margin-left: 0; }
    input[type=search] { min-width: 0; flex: 1 1 100%; }
    input[type=range] { width: 80px; }
    .more-toggle { display: inline-block; }
    .bar:not(.open) .more { display: none; }
    .bar .stat { width: 100%; }
    .legend { left: 8px; bottom: 8px; }
    .legend .how { display: none; }
    .legend:not(:has(.chips)) { display: none; }
    .legend .chips { margin-top: 0; }
    .card { right: 8px; bottom: 8px; width: calc(100% - 16px); }
  }
</style>
<!--THEME-->
</head>
<body>
<canvas id="map" aria-label="Stacked maps of SAE features at several layers"></canvas>
<div class="loading" id="loading">Loading the atlas…</div>
<div class="bar" id="bar">
  <!--BARHEAD-->
  <h1 id="title">Glimmer atlas</h1>
  <input type="search" id="q" placeholder="Search labels or feature ids" aria-label="Search features" autocomplete="off">
  <label class="slide">Layer <input type="range" id="layer" min="0" step="1" aria-label="Layer"> <b id="layerName"></b></label>
  <label class="slide">Stack <input type="range" id="spread" min="0" max="100" value="0" aria-label="Stack the layers"></label>
  <button type="button" class="more-toggle" id="more" aria-expanded="false">Options</button>
  <select id="color" class="more" aria-label="Color by">
    <option value="kind" selected>Color: kind</option>
    <option value="region">Color: region</option>
    <option value="layer">Color: layer</option>
    <option value="life">Color: lifespan</option>
    <option value="born">Color: born at layer</option>
    <option value="score">Color: steering</option>
    <option value="safety">Color: safety-relevant</option>
  </select>
  <label class="check more"><input type="checkbox" id="names" checked> Region names</label>
  <button type="button" id="reset" class="more">Reset view</button>
  <span class="stat" id="stat"></span>
</div>
<ul class="results" id="results"></ul>
<div class="tip" id="tip"></div>
<div class="card" id="card"></div>
<div class="legend" id="legend"></div>
<script type="module">
const SRC = /*SRC*/null;
const loading = document.getElementById("loading");
let DATA = /*DATA*/null;
if (!DATA) {
  try {
    const r = await fetch(SRC); if (!r.ok) throw new Error(r.status); DATA = await r.json();
    // the nine-layer atlas comes as one file per layer
    if (DATA.files) DATA.maps = await Promise.all(DATA.files.map(async (f) => { const x = await fetch(f); if (!x.ok) throw new Error(x.status); return x.json(); }));
  }
  catch (e) { loading.textContent = "The atlas didn't load. Reload the page to try again."; throw e; }
}
loading.remove();

const M = DATA.maps, NL = M.length;
M.forEach((m, li) => m.points.forEach((p) => { p.li = li; }));
const byId = M.map((m) => new Map(m.points.map((p) => [p.i, p])));
const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
const tip = document.getElementById("tip"), card = document.getElementById("card"), bar = document.getElementById("bar");
const qEl = document.getElementById("q"), results = document.getElementById("results");
const layerEl = document.getElementById("layer"), spreadEl = document.getElementById("spread"), colorEl = document.getElementById("color");
const SAFE = window.SAFE || { on: false, TEXT: "", hide: () => false, apply() {}, onChange() {} };  // Studio pages have no switch
for (const m of M) { SAFE.apply(m.points, ["l"]); SAFE.apply(m.regions, ["name"], ""); }
const hiddenName = (layer, j) => SAFE.on && (DATA.hn?.[layer] || []).includes(+j);
const safetyOpt = colorEl.querySelector('option[value="safety"]');
function safeUI() {
  if (!safetyOpt) return;
  safetyOpt.hidden = safetyOpt.disabled = SAFE.on;
  if (SAFE.on && colorEl.value === "safety") colorEl.value = "kind";
}
safeUI();
SAFE.onChange(() => { safeUI(); legend(); draw(); });
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hue = (i) => (i * 137.508) % 360;
// shallow layers cool, deep layers warm, however many there are
const layerColor = (li) => `hsl(${Math.round(200 - 175 * li / Math.max(1, NL - 1))}, 70%, 52%)`;
// the same kinds and colors as the layer maps; gray ones are drawn first so the colored sit on top
const KINDS = { concept: "#0064e0", syntax: "#8b5cf6", token: "#14a38b", format: "#f29a38", unclear: "#9aa6b4", unlabeled: "#cfd5dd" };
const KIND_ORDER = { unlabeled: 0, unclear: 1 };
for (const m of M) m.points.sort((a, b) => (KIND_ORDER[a.k] ?? 2) - (KIND_ORDER[b.k] ?? 2));
const scoreColor = (s) => (s >= 0.99 ? css("--accent") : s >= 0.66 ? "#f5a524" : s > 0 ? "#8fa3b5" : "#7b6ba8");
const SAFETY = { cbrn: "#e5484d", weapons_violence: "#f76b15", cyber: "#0090ff", deception_manipulation: "#d6409f",
  power_seeking: "#8e4ec6", sycophancy: "#ffc53d", hate_bias: "#a18072", self_harm: "#e54666", drugs: "#46a758", sexual: "#f39cc7", ai_self: "#12a594" };
// the judge's score is concept x fluency / 9: 1 is on topic and fluent, 0.667 one of the two slips
function steerWord(s) {
  if (s == null) return "not steering-tested";
  if (s >= 0.99) return "steers cleanly";
  if (s >= 0.66) return "steers partly";
  return s > 0 ? "weak effect" : "doesn't steer";
}

if (document.getElementById("site-nav")) {  // the shared site's header names the page
  document.getElementById("title").hidden = true;
  document.title = "Atlas · Glimmer Scope";
}

layerEl.max = NL - 1;
layerEl.value = Math.floor(NL / 2);
const all = M.flatMap((m) => m.points);
// a loop, not Math.min(...): spreading half a million points overflows the call stack
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const p of all) { if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x; if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; }
const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, half = Math.max(maxX - minX, maxY - minY) / 2;
let view = { s: 1, ox: 0, oy: 0 }, fitScale = 1, matches = null, selected = null, grid = null;

const active = () => +layerEl.value;
const spread = () => +spreadEl.value / 100;
const top = () => bar.getBoundingClientRect().bottom + 8;

// plane coordinates in [-1, 1], then the stacked transform: rotate, tilt, lift deeper layers up
function place(u, v, li, t) {
  if (t > 0) {
    const a = t * 0.6, ca = Math.cos(a), sa = Math.sin(a);
    [u, v] = [u * ca - v * sa, u * sa + v * ca];
    v = v * (1 - 0.62 * t) - (li - (NL - 1) / 2) * t * 1.2;
  }
  return [u, v];
}
const plane = (p) => [(p.x - cx) / half, (p.y - cy) / half];
function project(p, t = spread()) {
  const [u, v] = place(...plane(p), p.li, t);
  return [view.ox + view.s * u, view.oy + view.s * v];
}
const visibleLayers = () => (spread() > 0 ? M.map((_, li) => li) : [active()]);

function fit() {
  const t = spread(), w = canvas.clientWidth, h = canvas.clientHeight, head = top(), pad = w < 640 ? 16 : 40;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const li of visibleLayers()) for (const [u, v] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const [a, b] = place(u, v, li, t);
    x0 = Math.min(x0, a); x1 = Math.max(x1, a); y0 = Math.min(y0, b); y1 = Math.max(y1, b);
  }
  const s = Math.min((w - pad * 2) / (x1 - x0), (h - head - pad * 2) / (y1 - y0));
  view = { s, ox: w / 2 - s * (x0 + x1) / 2, oy: head + (h - head) / 2 - s * (y0 + y1) / 2 };
  fitScale = s;
}

function colorOf(p) {
  const mode = colorEl.value;
  if (mode === "kind") return KINDS[p.k] || KINDS.unclear;
  if (mode === "layer") return layerColor(p.li);
  if (mode === "life") return spanColor(lifeOf(p).span);
  if (mode === "born") return layerColor(lifeOf(p).born);
  if (mode === "score") return p.s == null ? css("--dim") : scoreColor(p.s);
  if (mode === "safety") return p.f ? SAFETY[p.f] : css("--dim");
  return `hsl(${hue(p.r + p.li * 41)}, 46%, 58%)`;
}

function partnerPoint(p, dir, j) {
  const li = p.li + (dir === "u" ? 1 : -1);
  return li >= 0 && li < NL ? byId[li].get(j) : null;
}
// A feature's lineage: from it, follow the strongest partner up and down through every layer while
// the link holds (THREAD), and note where the concept splits (a second partner almost as strong
// on the next layer) or merges (another feature on the layer below that feeds the same one).
const THREAD = 0.3, SIBLING = 0.75;
function best(p, dir) {
  for (const [j, c] of p[dir] || []) { const q = partnerPoint(p, dir, j); if (q) return [q, c]; }
  return null;
}
function thread(p) {
  const steps = [{ p, c: null }];
  for (const dir of ["u", "d"]) {
    let cur = p;
    for (let n = 0; n < NL; n++) {
      const b = best(cur, dir);
      if (!b || b[1] < THREAD) break;
      const [q, c] = b;
      const branch = (cur[dir] || []).slice(1).map(([j, cc]) => [partnerPoint(cur, dir, j), cc])
        .filter(([o, cc]) => o && cc >= THREAD && cc >= SIBLING * c);
      const step = { p: q, c, from: cur, dir, branch };
      dir === "u" ? steps.push(step) : steps.unshift(step);
      cur = q;
    }
  }
  return steps;  // shallowest layer first
}
function lineage(p) {  // [a, b, cos, kind]: the thread itself, then its splits and merges
  const edges = [];
  for (const st of thread(p)) {
    if (!st.from) continue;
    edges.push([st.from, st.p, st.c, "thread"]);
    for (const [o, cc] of st.branch) edges.push([st.from, o, cc, "branch"]);
  }
  return edges;
}

// lifespan and birth layer of every feature's thread, computed once when a mode needs them
let life = null;
function lifeOf(p) {
  if (!life) {
    life = new Map();
    const upLen = new Map(), downLen = new Map();
    for (let li = NL - 1; li >= 0; li--) for (const q of M[li].points) {
      const b = best(q, "u"); upLen.set(q, b && b[1] >= THREAD ? 1 + (upLen.get(b[0]) || 0) : 0);
    }
    for (let li = 0; li < NL; li++) for (const q of M[li].points) {
      const b = best(q, "d"); downLen.set(q, b && b[1] >= THREAD ? 1 + (downLen.get(b[0]) || 0) : 0);
    }
    for (const m of M) for (const q of m.points) {
      const dn = downLen.get(q);
      life.set(q, { span: upLen.get(q) + dn + 1, born: q.li - dn });
    }
  }
  return life.get(p);
}
const spanColor = (n) => `hsl(222, ${30 + 45 * (n - 1) / Math.max(1, NL - 1)}%, ${84 - 50 * (n - 1) / Math.max(1, NL - 1)}%)`;

// region names, biggest region first, leaving out any that would overlap one already drawn
// region names on small labels, biggest first: a few when zoomed out, more as you zoom in,
// never overlapping, never twice the same, never cut by the edge
function drawNames(items) {
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif";
  const placed = [], shown = new Set(), W = canvas.clientWidth, H = canvas.clientHeight, ink = css("--ink"), bg = css("--panel") || "#fff";
  const room = Math.round(18 * Math.min(6, view.s / fitScale) * Math.min(1, W / 900));
  for (const it of items.filter((i) => i.name).sort((a, b) => b.size - a.size)) {
    if (placed.length >= room) break;
    if (shown.has(it.name)) continue;
    const w = ctx.measureText(it.name).width + 14, box = [it.X - w / 2, it.Y - 11, it.X + w / 2, it.Y + 11];
    if (box[0] < 4 || box[2] > W - 4 || box[1] < 4 || box[3] > H - 40) continue;
    if (placed.some((b) => box[0] < b[2] + 4 && box[2] > b[0] - 4 && box[1] < b[3] + 4 && box[3] > b[1] - 4)) continue;
    placed.push(box); shown.add(it.name);
    ctx.globalAlpha = 0.92; ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(box[0], box[1], w, 22, 11); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = ink; ctx.fillText(it.name, it.X, it.Y + 0.5);
  }
}

function draw() {
  const dpr = window.devicePixelRatio || 1, t = spread();
  canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css("--map"); ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  // points shrink with how many there are, so 60,000 a layer stay a map and not a smear
  const r = Math.max(1, Math.min(3.5, view.s * 0.003)), dim = css("--dim"), ink = css("--ink");
  grid = new Map();
  for (const li of visibleLayers()) {
    const focus = li === active();
    if (t > 0) {
      ctx.beginPath();
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([u, v], n) => {
        const [a, b] = place(u * 1.04, v * 1.04, li, t); const X = view.ox + view.s * a, Y = view.oy + view.s * b;
        n ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
      });
      ctx.closePath(); ctx.fillStyle = css("--plane"); ctx.fill();
      ctx.strokeStyle = focus ? css("--accent") : css("--line"); ctx.lineWidth = focus ? 1.5 : 1; ctx.stroke();
      const [a, b] = place(-1.04, 1.04, li, t);
      ctx.font = "600 12px ui-sans-serif, system-ui, sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
      ctx.fillStyle = focus ? css("--accent") : css("--muted");
      ctx.fillText(`layer ${M[li].layer}`, view.ox + view.s * a - 8, view.oy + view.s * b);
    }
    ctx.globalAlpha = t > 0 && !focus ? 0.55 : 0.85;
    for (const p of M[li].points) {
      const lit = !matches || matches.has(p);
      const [X, Y] = project(p, t);
      ctx.fillStyle = lit ? colorOf(p) : dim;
      ctx.fillRect(X - r / 2, Y - r / 2, r, r);
      if (lit) { const key = `${Math.floor(X / 12)},${Math.floor(Y / 12)}`; (grid.get(key) || grid.set(key, []).get(key)).push(p); }
    }
    ctx.globalAlpha = 1;
  }
  if (matches) {
    ctx.strokeStyle = ink; ctx.lineWidth = 1;
    let n = 0;
    for (const p of matches) {
      if (!visibleLayers().includes(p.li) || ++n > 4000) continue;
      const [X, Y] = project(p, t); ctx.beginPath(); ctx.arc(X, Y, r + 2.5, 0, 6.283); ctx.stroke();
    }
    if (t > 0 && !selected) {  // how the matches connect across layers; a selected thread takes over
      ctx.strokeStyle = css("--accent"); ctx.globalAlpha = 0.5;
      for (const p of matches) for (const [j, c] of p.u || []) {
        const q = partnerPoint(p, "u", j);
        if (q && matches.has(q)) { const [a, b] = project(p, t), [e, f] = project(q, t); ctx.lineWidth = 0.5 + 2 * c; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(e, f); ctx.stroke(); }
      }
      ctx.globalAlpha = 1;
    }
  }
  if (selected) {
    if (t > 0) {
      // the thread through every layer, thick; its splits and merges thin and dashed
      for (const [a, b, c, kind] of lineage(selected)) {
        const [x1, y1] = project(a, t), [x2, y2] = project(b, t);
        ctx.strokeStyle = b.li > a.li ? css("--up") : css("--down");
        ctx.globalAlpha = kind === "thread" ? 0.45 + 0.55 * c : 0.5; ctx.lineWidth = kind === "thread" ? 1.5 + 3 * c : 1.2;
        ctx.setLineDash(kind === "thread" ? [] : [4, 3]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
      ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.strokeStyle = ink; ctx.lineWidth = 1.5;
      for (const st of thread(selected)) if (st.p !== selected) {
        const [X, Y] = project(st.p, t); ctx.beginPath(); ctx.arc(X, Y, r + 3.5, 0, 6.283); ctx.stroke();
      }
    } else {  // flat: the layouts are aligned, so partners show where they sit on their own layer
      for (const dir of ["u", "d"]) for (const [j, c] of selected[dir] || []) {
        const q = partnerPoint(selected, dir, j); if (!q) continue;
        const [X, Y] = project({ ...q, li: active() }, 0);
        ctx.strokeStyle = dir === "u" ? css("--up") : css("--down"); ctx.lineWidth = 1 + 2 * c; ctx.globalAlpha = 0.4 + 0.6 * c;
        ctx.beginPath(); ctx.arc(X, Y, r + 4, 0, 6.283); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    if (visibleLayers().includes(selected.li)) {
      const [X, Y] = project(selected, t);
      ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(X, Y, r + 5, 0, 6.283); ctx.stroke();
    }
  }
  if (document.getElementById("names").checked && !matches) {
    const li = active();
    drawNames(M[li].regions.map((reg) => { const [X, Y] = project({ x: reg.x, y: reg.y, li }, t); return { name: reg.name, size: reg.size, X, Y }; }));
  }
  const m = M[active()];
  document.getElementById("layerName").textContent = m.layer;
  const counts = matches ? M.map((mm, li) => `L${mm.layer} ${[...matches].filter((p) => p.li === li).length}`).join(" · ") : "";
  document.getElementById("stat").textContent = matches ? `matches: ${counts}`
    : `layer ${m.layer}: ${m.points.length.toLocaleString()} features · ${m.regions.filter((r) => r.size).length} regions · ${m.tested.toLocaleString()} steering-tested`;
}

function nearest(mx, my, reach = 64) {
  let best = null, bd = reach;
  const gx = Math.floor(mx / 12), gy = Math.floor(my / 12), t = spread();
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (const p of grid.get(`${gx + i},${gy + j}`) || []) {
    const [X, Y] = project(p, t), d = (X - mx) ** 2 + (Y - my) ** 2 - (p.li === active() ? 20 : 0);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function describe(p) {
  const m = M[p.li], reg = m.regions[p.r];
  return `<b>${esc(p.l)}</b><div class="meta">layer ${m.layer} · feature ${p.i} · ${esc(reg.name)} · ${steerWord(p.s)}` +
    (p.f ? ` · flagged: ${esc(p.f)}` : "") + `</div>`;
}
function partnerList(p, dir) {
  const li = p.li + (dir === "u" ? 1 : -1);
  if (li < 0 || li >= NL) return "";
  const rows = (p[dir] || []).map(([j, c]) => {
    const q = byId[li].get(j);
    const name = q ? `<a data-li="${li}" data-id="${j}">${esc(q.l)}</a>` : esc(hiddenName(M[li].layer, j) ? SAFE.TEXT : (DATA.names[M[li].layer] || {})[j] || "unlabeled");
    return `<li><span class="cos">${c.toFixed(2)}</span><span>${name} <span class="meta">#${j}</span></span></li>`;
  });
  const title = dir === "u" ? `Turns into, layer ${M[li].layer}` : `Comes from, layer ${M[li].layer}`;
  return `<h3>${title}</h3>` + (rows.length ? `<ul>${rows.join("")}</ul>` : `<div class="meta">no partner above ${0.15}</div>`);
}
function timeline(p) {
  const steps = thread(p).slice().reverse();  // deepest first, like the stack
  if (steps.length < 2) return `<h3>Lineage</h3><div class="meta">No link of ${THREAD} or more to the layers next to it: this feature lives on this layer only.</div>`;
  const span = steps.length, from = M[steps[steps.length - 1].p.li].layer, to = M[steps[0].p.li].layer;
  const rows = steps.map((st, n) => {
    const q = st.p, below = steps[n + 1];
    // the link to the row below (one layer shallower): an up step carries it, otherwise the step below does
    const c = st.dir === "u" ? st.c : below ? below.c : null;
    const link = `<span class="cos">${c != null ? c.toFixed(2) : ""}</span>`;
    const name = q === p ? `<b>${esc(q.l)}</b>` : `<a data-li="${q.li}" data-id="${q.i}">${esc(q.l)}</a>`;
    const extra = [];
    if (st.dir === "u" && st.branch.length) extra.push(`splits: ${st.branch.map(([o]) => `<a data-li="${o.li}" data-id="${o.i}">${esc(o.l)}</a>`).join(", ")}`);
    if (st.dir === "d" && st.branch.length) extra.push(`merges with: ${st.branch.map(([o]) => `<a data-li="${o.li}" data-id="${o.i}">${esc(o.l)}</a>`).join(", ")}`);
    return `<li class="step${q === p ? " here" : ""}"><span class="lyr">L${M[q.li].layer}</span>${link}<span>${name}${extra.length ? `<div class="meta">${extra.join(" · ")}</div>` : ""}</span></li>`;
  });
  return `<h3>Lineage: ${span} layers, ${from} to ${to}</h3><ul class="thread">${rows.join("")}</ul>` +
    (spread() === 0 ? `<button type="button" class="stackit">Show the thread in the stack</button>` : "");
}
function select(p) {
  selected = p;
  history.replaceState(null, "", p ? `#L${M[p.li].layer}-${p.i}` : location.pathname + location.search);
  if (!p) { card.style.display = "none"; draw(); return; }
  if (spread() === 0 && p.li !== active()) layerEl.value = p.li;
  card.innerHTML = `<button type="button" class="close">Close</button>${describe(p)}${timeline(p)}
    <details><summary>All partners one layer away</summary>${partnerList(p, "d")}${partnerList(p, "u")}</details>
    <div class="meta" style="margin-top:8px">Numbers are how alike two features' firing is on the same ${DATA.tokens.toLocaleString()} tokens (1 = identical). The thread follows the strongest partner while it stays at ${THREAD} or more.</div>`;
  const stackit = card.querySelector(".stackit");
  if (stackit) stackit.onclick = () => { spreadEl.value = spreadEl.max; fit(); legend(); select(p); };
  card.style.display = "block";
  card.querySelector(".close").onclick = () => select(null);
  card.querySelectorAll("a[data-id]").forEach((a) => { a.onclick = () => select(byId[+a.dataset.li].get(+a.dataset.id)); });
  draw();
}
// center a feature on its own layer, zoomed in, and open it
function focus(p) {
  if (!p) return;
  if (spread() === 0) layerEl.value = p.li;
  const w = canvas.clientWidth, h = canvas.clientHeight, head = top();
  const [u, v] = place(...plane(p), p.li, spread());
  view.s = Math.max(view.s, fitScale * 4);
  view.ox = w / 2 - view.s * u; view.oy = head + (h - head) / 2.6 - view.s * v;
  select(p);
}

function legend() {
  const el = document.getElementById("legend"), mode = colorEl.value;
  const how = spread() > 0
    ? `Stacked: deeper layers above. Click a feature for its thread through every layer<i style="background:${css("--down")}"></i>comes from<i style="background:${css("--up")}"></i>turns into · dashed: splits and merges`
    : `Same subject, same place on every layer. Slide Layer to move through depth, Stack to pull the layers apart.`;
  let chips = "";
  if (mode === "score") {
    chips = [[1, "steers cleanly"], [0.667, "partly"], [0.333, "weak"], [0, "doesn't steer"]]
      .map(([s, t]) => `<i style="background:${scoreColor(s)}"></i>${t}`).join("") + `<i style="background:${css("--muted")};opacity:.3"></i>not tested`;
  } else if (mode === "kind") {
    const pts = M[active()].points, count = {};
    for (const p of pts) count[p.k] = (count[p.k] || 0) + 1;
    chips = Object.entries(KINDS).filter(([k]) => count[k]).map(([k, c]) => `<i style="background:${c}"></i>${k} ${count[k].toLocaleString()}`).join("");
  } else if (mode === "life") {
    const count = Array(NL + 1).fill(0);
    for (const p of M[active()].points) count[lifeOf(p).span]++;
    chips = count.map((n, k) => (k && n ? `<i style="background:${spanColor(k)}"></i>${k} layer${k > 1 ? "s" : ""} ${n.toLocaleString()}` : "")).join("");
  } else if (mode === "born") {
    const count = Array(NL).fill(0);
    for (const p of M[active()].points) count[lifeOf(p).born]++;
    chips = count.map((n, li) => (n ? `<i style="background:${layerColor(li)}"></i>born at ${M[li].layer} ${n.toLocaleString()}` : "")).join("");
  } else if (mode === "layer") {
    chips = M.map((m, li) => `<i style="background:${layerColor(li)}"></i>layer ${m.layer}`).join("");
  }
  el.innerHTML = `<div class="how">${how}</div>` + (chips ? `<div class="chips">${chips}</div>` : "");
}

// mouse, pen and touch: drag to move, wheel or pinch to zoom, tap or click to open
const pointers = new Map();
let drag = null, pinch = null;
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  results.style.display = "none"; tip.style.display = "none";
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, ox: view.ox, oy: view.oy, moved: false };
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: view.s, ox: view.ox, oy: view.oy, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
    drag = null;
  }
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()], f = Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    view.s = pinch.s * f; view.ox = mx - (pinch.mx - pinch.ox) * f; view.oy = my - (pinch.my - pinch.oy) * f;
    tip.style.display = "none"; draw(); return;
  }
  if (drag) {
    view.ox = drag.ox + e.clientX - drag.x; view.oy = drag.oy + e.clientY - drag.y;
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > (e.pointerType === "mouse" ? 3 : 8)) drag.moved = true;
    if (drag.moved) { tip.style.display = "none"; draw(); }
    return;
  }
  if (e.pointerType !== "mouse") return;
  const p = nearest(e.clientX, e.clientY);
  if (!p) { tip.style.display = "none"; return; }
  tip.innerHTML = describe(p); tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 360) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
function release(e) {
  pointers.delete(e.pointerId);
  if (drag && !drag.moved && e.type === "pointerup") select(nearest(e.clientX, e.clientY, e.pointerType === "mouse" ? 64 : 400));
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) { drag = null; canvas.classList.remove("dragging"); }
}
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") tip.style.display = "none"; });
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015);
  view.ox = e.clientX - (e.clientX - view.ox) * f; view.oy = e.clientY - (e.clientY - view.oy) * f; view.s *= f;
  draw();
}, { passive: false });

// search: matches light up on every layer, and the best ones are listed to jump to
let found = [];
function search() {
  const q = qEl.value.trim().toLowerCase();
  if (!q) { matches = null; found = []; results.style.display = "none"; draw(); return; }
  found = all.filter((p) => p.l.toLowerCase().includes(q) || String(p.i) === q)
    .sort((a, b) => (String(b.i) === q) - (String(a.i) === q) || (b.li === active()) - (a.li === active()) || (b.s ?? -1) - (a.s ?? -1));
  matches = new Set(found);
  const box = qEl.getBoundingClientRect();
  results.style.left = Math.max(8, Math.min(box.left, window.innerWidth - results.offsetWidth - 8)) + "px";
  results.style.top = box.bottom + 6 + "px";
  results.innerHTML = found.length
    ? found.slice(0, 12).map((p, n) => `<li><button type="button" data-n="${n}">${esc(p.l)} <span class="meta">layer ${M[p.li].layer} · #${p.i} · ${steerWord(p.s)}</span></button></li>`).join("") +
      (found.length > 12 ? `<li class="meta">${found.length - 12} more lit up on the maps</li>` : "")
    : `<li class="meta">No feature matches “${esc(q)}”.</li>`;
  results.style.display = "block";
  results.querySelectorAll("button").forEach((b) => { b.onclick = () => { results.style.display = "none"; focus(found[+b.dataset.n]); }; });
  draw();
}
qEl.addEventListener("input", search);
qEl.addEventListener("focus", () => { if (qEl.value.trim()) search(); });
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && found.length) { results.style.display = "none"; focus(found[0]); }
  if (e.key === "Escape") { qEl.value = ""; search(); }
  if (e.key === "ArrowDown") { e.preventDefault(); results.querySelector("button")?.focus(); }
});
results.addEventListener("keydown", (e) => {
  const items = [...results.querySelectorAll("button")], i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown" && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
  if (e.key === "ArrowUp") { e.preventDefault(); (i > 0 ? items[i - 1] : qEl).focus(); }
  if (e.key === "Escape") { results.style.display = "none"; qEl.focus(); }
});
document.addEventListener("pointerdown", (e) => { if (!results.contains(e.target) && e.target !== qEl) results.style.display = "none"; });

document.getElementById("more").addEventListener("click", (e) => {
  const open = bar.classList.toggle("open"); e.target.setAttribute("aria-expanded", open); fit(); draw();
});
layerEl.addEventListener("input", () => { legend(); draw(); });
let lastSpread = 0;
spreadEl.addEventListener("input", () => {
  // refit when the stack opens or closes, keep the user's zoom while it moves
  if ((spread() === 0) !== (lastSpread === 0)) fit();
  lastSpread = spread(); legend(); draw();
});
spreadEl.addEventListener("change", () => { fit(); draw(); });
colorEl.addEventListener("change", () => { legend(); draw(); });
document.getElementById("names").addEventListener("change", draw);
document.getElementById("reset").addEventListener("click", () => { fit(); draw(); });
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type === "search") return;
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    layerEl.value = Math.max(0, Math.min(NL - 1, active() + (e.key === "ArrowRight" ? 1 : -1))); draw();
  }
  if (e.key === "Escape") select(null);
});
window.addEventListener("themechange", () => { legend(); draw(); });  // the light/dark switch in the header
window.addEventListener("resize", () => { fit(); draw(); });
fit(); legend(); draw();
const link = location.hash.match(/^#L(\d+)-(\d+)$/);
if (link) {
  const li = M.findIndex((m) => m.layer === +link[1]);
  if (li >= 0) focus(byId[li].get(+link[2]));
}
</script>
</body>
</html>
